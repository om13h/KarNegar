name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APKs (debug + signed release)
        run: |
          chmod +x gradlew
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace
          else
            gradle assembleDebug assembleRelease --stacktrace
          fi

      - name: Collect APKs
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/KarNegar-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk output/KarNegar-debug.apk
          ls -la output

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KarNegar-APKs
          path: output/

      - name: Attach APK to GitHub Release (version tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/KarNegar-release.apk

      - name: Update "Latest" Release with fresh APK (every push to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "آخرین نسخه — دانلود مستقیم APK"
          body: |
            فایل **KarNegar-release.apk** را دانلود و روی گوشی نصب کن (نسخه امضاشده Release).

            این Release با هر تغییر در کد، خودکار به‌روز می‌شود — همیشه همین صفحه را باز کن.
          files: output/KarNegar-release.apk
          make_latest: "true"
